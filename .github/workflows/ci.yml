name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Check types
        run: bun run typecheck
      - name: Check lint and formatting
        run: bun run format
      - name: Run tests
        # Hosted macOS runners have ~3 cores and ~7 GB of memory, far less than
        # a development host. Package test suites run one at a time and the
        # process-backed bot suite halves its worker pool so the peak footprint
        # stays inside the runner instead of being killed for exhausting it.
        env:
          VITEST_MAX_WORKERS: 2
        run: bun run test:ci
