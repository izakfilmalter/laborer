name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Check types
        run: bun run typecheck
      - name: Check lint and formatting
        run: bun run format
      - name: Run tests
        run: bun run test
