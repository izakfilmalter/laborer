name: CI

on:
  merge_group:
  pull_request:
    branches: ["*"]
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: current
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  next:
    name: Next / CI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: next
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: next/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: next/.node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify runtime versions
        run: bun run verify:runtimes

      - name: Format check
        run: bun run format

      - name: Typecheck
        run: bun run typecheck

      - name: Deterministic and Emulate tests
        run: bun run test

      - name: OpenCode ACP compatibility and policy
        run: bun run test:acp-compatibility
