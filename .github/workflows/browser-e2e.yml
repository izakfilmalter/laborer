name: Browser end-to-end gate

on:
  pull_request:
  push:
    branches: [master]

jobs:
  browser-e2e:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: bun run build
      - run: bun run --cwd apps/web test:e2e --project=browser
