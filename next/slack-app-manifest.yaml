_metadata:
  major_version: 1
display_information:
  name: Laborer
  description: Runs local work handlers from explicitly activated Slack threads.
features:
  bot_user:
    display_name: Laborer
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - chat:write
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  org_deploy_enabled: false
  socket_mode_enabled: true
  is_hosted: false
  token_rotation_enabled: false
